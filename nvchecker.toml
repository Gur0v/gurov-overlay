[anydesk]
source = "aur"
aur = "anydesk-bin"

[ayugram-desktop]
source = "github"
github = "AyuGram/AyuGramDesktop"
use_max_tag = true
prefix = "v"

[bubblejail]
source = "github"
github = "igo95862/bubblejail"
use_latest_release = true

[cachyos-settings]
source = "github"
github = "CachyOS/CachyOS-Settings"
use_latest_release = true
prefix = "v"

[easyeffects]
source = "github"
github = "wwmm/easyeffects"
use_max_tag = true
prefix = "v"
exclude_regex = "(?i).*(alpha|beta).*"

[ente-auth]
source = "github"
github = "ente-io/ente"
use_max_tag = true
include_regex = "^auth-v.*"
exclude_regex = "(?i).*(alpha|beta).*"
prefix = "auth-v"

[firefox-phoenix]
source = "aur"
aur = "phoenix-arch"

[gearlever]
source = "github"
github = "mijorus/gearlever"
use_latest_release = true

[mcpelauncher]
source = "github"
github = "minecraft-linux/mcpelauncher-manifest"
use_max_tag = true
include_regex = ".*-qt6$"
from_pattern = "^v(.*)-qt6$"
to_pattern = "\\1"

[mcpelauncher-ui-qt]
source = "github"
github = "minecraft-linux/mcpelauncher-ui-manifest"
use_max_tag = true
include_regex = ".*-qt6$"
from_pattern = "^v(.*)-qt6$"
to_pattern = "\\1"

[mindwtr]
source = "github"
github = "dongdongbh/Mindwtr"
use_max_tag = true
prefix = "v"
exclude_regex = "(?i).*(alpha|beta|rc).*"

[protonplus]
source = "github"
github = "Vysp3r/ProtonPlus"
use_max_tag = true
prefix = "v"

[thunderbird-dove]
source = "aur"
aur = "dove"

[veracrypt]
source = "github"
github = "veracrypt/VeraCrypt"
use_max_tag = true
prefix = "VeraCrypt_"
exclude_regex = "(?i).*(alpha|beta).*"

[viber]
source = "aur"
aur = "viber"

[zoom]
source = "aur"
flathub = "zoom"
